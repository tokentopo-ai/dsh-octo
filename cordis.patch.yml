- insert:
    - id: dsh-octo-skill-provider
      name: dsh-octo
    - id: dsh-octo-subagent-codex
      name: '@deepseek-ai/dsh-subagent-codex'
    - id: dsh-octo-subagent-claude-code
      name: '@deepseek-ai/dsh-subagent-claude-code'
    - id: dsh-octo-tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed
    - id: dsh-octo-tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed
    - id: dsh-octo-tool-subagent-deepseek-v4-pro
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_deepseek_v4_pro
        agentOptions:
          provider: deepseek-official
          model: deepseek-v4-pro
        backgroundMode: continuable
    - id: dsh-octo-tool-subagent-deepseek-v4-flash
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_deepseek_v4_flash
        agentOptions:
          provider: deepseek-official
          model: deepseek-v4-flash
        backgroundMode: continuable
